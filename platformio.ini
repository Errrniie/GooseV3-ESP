; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
	adafruit/Adafruit BNO055
	adafruit/Adafruit Unified Sensor
; deep+ so the dependency finder scans library sources (Adafruit BusIO needs
; SPI.h) even in tests that don't include Wire/SPI themselves.
lib_ldf_mode = deep+
; upload_port / monitor_port intentionally omitted so PlatformIO auto-detects
; on both macOS (/dev/cu.usbserial-*) and Windows (COM3, COM4, ...).

; hello world
